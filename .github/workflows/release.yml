name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build portable EXE
        shell: pwsh
        run: ./build/build.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Generate WinGet manifests
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $exe = Join-Path $PWD 'dist\PingMonitor.exe'
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PingMonitor.exe"
          ./build/New-WingetManifest.ps1 -Version $version -InstallerUrl $url -InstallerSha256 $sha
          Compress-Archive -Path dist\winget\* -DestinationPath dist\winget-manifests.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PingMonitor.exe
            dist/winget-manifests.zip
